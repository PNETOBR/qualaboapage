<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QualABoa? - Em breve</title>
    <meta
      name="description"
      content="O download do QualABoa estará disponível em breve. Descubra cafés, restaurantes, bares e baladas perto de você."
    />
    <meta name="theme-color" content="#F99B2A" />
    <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
    <link rel="shortcut icon" href="/assets/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="QualABoa" />
    <link rel="manifest" href="/assets/images/site.webmanifest" />
    <style>
      :root {
        --purple: #7c3aed;
        --purple-hover: #6d28d9;
        --purple-ink: #3b1364;
        --orange-light: #ffc14b;
        --orange: #f99b2a;
        --orange-strong: #f4741b;
        --cream: #fff9f1;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #374151;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(circle at 12% 12%, rgba(255, 249, 241, 0.55), transparent 28%),
          radial-gradient(circle at 88% 80%, rgba(217, 70, 239, 0.24), transparent 34%),
          linear-gradient(165deg, #ffc14b 0%, #f99b2a 38%, #f4741b 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        overflow-x: clip;
      }

      .panel {
        width: min(660px, 100%);
        padding: 42px;
        border-radius: 28px;
        text-align: center;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 28px 70px rgba(59, 19, 100, 0.24);
      }

      .q-mark {
        display: block;
        width: 116px;
        height: auto;
        margin: 0 auto 12px;
        filter: drop-shadow(0 18px 26px rgba(124, 58, 237, 0.22));
        animation: qbFloat 5s ease-in-out infinite;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        color: #ffffff;
        background: linear-gradient(90deg, #7c3aed, #d946ef);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 1.1px;
        text-transform: uppercase;
      }

      .wordmark {
        display: block;
        width: min(360px, 82vw);
        height: auto;
        margin: 22px auto 0;
      }

      h1 {
        max-width: 12ch;
        margin: 24px auto 0;
        color: var(--purple-ink);
        font-size: clamp(2.1rem, 7vw, 3.4rem);
        line-height: 1.05;
        font-weight: 950;
        letter-spacing: 0;
        text-wrap: balance;
      }

      p {
        max-width: 34rem;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
        font-weight: 650;
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 18px;
        border: 1px solid transparent;
        font-weight: 900;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s;
      }

      .btn:hover {
        transform: translateY(-3px);
      }

      .btn--primary {
        color: #ffffff;
        background: linear-gradient(90deg, #7c3aed, #d946ef);
        box-shadow: 0 16px 32px rgba(59, 19, 100, 0.32);
      }

      .btn--ghost {
        color: var(--purple);
        background: #ffffff;
        border-color: rgba(124, 58, 237, 0.16);
      }

      @keyframes qbFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 16px;
        }

        .panel {
          padding: 30px 20px;
          border-radius: 22px;
        }

        .actions,
        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="title">
        <img class="q-mark" src="/assets/images/q-mark-nobg.png" alt="" aria-hidden="true" />
        <span class="badge">Lançamento em breve</span>
        <img class="wordmark" src="/assets/images/wordmark-nobg.png" alt="QualABoa?" />
        <h1 id="title">Os links de download chegam em breve.</h1>
        <p>
          O QualABoa está quase pronto para mostrar o que está aberto agora, o que rola hoje e como chegar sem complicar
          a escolha.
        </p>
        <div class="actions">
          <a class="btn btn--primary" href="/">Voltar para o início</a>
          <a class="btn btn--ghost" href="https://www.instagram.com/qualaboaapp_/" target="_blank" rel="noopener noreferrer">
            Acompanhar no Instagram
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
